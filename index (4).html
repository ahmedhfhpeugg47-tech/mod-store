<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر التعديلات - Mod Store</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; }
        header { background: #111827; padding: 20px; text-align: center; border-bottom: 3px solid #3b82f6; }
        header h1 { color: #60a5fa; font-size: 24px; margin-bottom: 5px; }
        .container { max-width: 800px; margin: 20px auto; padding: 0 10px; }
        .game-card { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 15px; margin-bottom: 10px; text-align: center; }
        .download-btn { background-color: #3b82f6; color: white; border: none; padding: 8px 15px; border-radius: 5px; margin-top: 10px; width: 100%; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h1>🎮 متجر الألعاب المعدلة</h1>
        <p>أفضل المودات المجانية</p>
    </header>
    <div class="container">
        <div class="game-card">
            <h3>Subway Surfers</h3>
            <p>مود: أموال غير محدودة</p>
            <button class="download-btn" onclick="alert('جارٍ التحميل...')">تحميل Mod</button>
        </div>
    </div>
</body>
</html>
